# Baut die App bei jeder Änderung auf „main“ und veröffentlicht sie auf GitHub Pages.
# Startseite = Offline-Fassung (alles eingebettet, lädt nichts aus fremden Quellen nach).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: python3 tools/build.py
      - name: Seite zusammenstellen
        run: |
          mkdir -p site
          cp dist/kalea-ride-offline.html site/index.html
          cp dist/kalea-ride.html dist/kalea-ride-offline.html site/
          cp tools/ulm-haeuser-holen.html tools/ulm-routen-holen.html site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
